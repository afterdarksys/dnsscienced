options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { any; };
    recursion no;
    allow-query { any; };
    minimal-responses no;
    empty-zones-enable no;
    dnssec-validation no;
};

zone "example.test" {
    type primary;
    file "/zones/example.test.zone";
};
