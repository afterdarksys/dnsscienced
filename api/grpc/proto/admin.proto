syntax = "proto3";

package dnsscience.v1;

option go_package = "github.com/dnsscience/dnsscienced/api/grpc/proto/pb";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// AdminService provides control plane operations for DNSScienced
service AdminService {
  // Cache operations
  rpc FlushCache(AdminFlushCacheRequest) returns (AdminFlushCacheResponse);
  rpc GetCacheStats(google.protobuf.Empty) returns (AdminCacheStatsResponse);
  rpc PurgeCache(AdminPurgeCacheRequest) returns (AdminPurgeCacheResponse);

  // Zone operations
  rpc RefreshZone(AdminRefreshZoneRequest) returns (AdminRefreshZoneResponse);
  rpc ListZones(google.protobuf.Empty) returns (AdminListZonesResponse);
  rpc ReloadZones(google.protobuf.Empty) returns (AdminReloadZonesResponse);

  // Zone management (create/update/delete)
  rpc CreateZone(AdminCreateZoneRequest) returns (AdminCreateZoneResponse);
  rpc UpdateZone(AdminUpdateZoneRequest) returns (AdminUpdateZoneResponse);
  rpc DeleteZone(AdminDeleteZoneRequest) returns (AdminDeleteZoneResponse);
  rpc GetZone(AdminGetZoneRequest) returns (AdminGetZoneResponse);

  // Record management
  rpc CreateRecord(AdminCreateRecordRequest) returns (AdminCreateRecordResponse);
  rpc UpdateRecord(AdminUpdateRecordRequest) returns (AdminUpdateRecordResponse);
  rpc DeleteRecord(AdminDeleteRecordRequest) returns (AdminDeleteRecordResponse);
  rpc ListRecords(AdminListRecordsRequest) returns (AdminListRecordsResponse);

  // Query logging control
  rpc SetQueryLogging(AdminSetQueryLoggingRequest) returns (AdminSetQueryLoggingResponse);
  rpc GetQueryLoggingStatus(google.protobuf.Empty) returns (AdminQueryLoggingStatusResponse);

  // Rate limiting control
  rpc SetRateLimit(AdminSetRateLimitRequest) returns (AdminSetRateLimitResponse);
  rpc GetRateLimitStatus(google.protobuf.Empty) returns (AdminRateLimitStatusResponse);

  // Server control
  rpc GetServerStatus(google.protobuf.Empty) returns (AdminServerStatusResponse);
  rpc GetMetrics(google.protobuf.Empty) returns (AdminMetricsResponse);
  rpc ShutdownServer(AdminShutdownRequest) returns (AdminShutdownResponse);

  // Connection management
  rpc ListConnections(AdminListConnectionsRequest) returns (AdminListConnectionsResponse);
  rpc KillConnection(AdminKillConnectionRequest) returns (AdminKillConnectionResponse);

  // TSIG Key Management (RFC 2845)
  rpc AddTsigKey(AdminAddTsigKeyRequest) returns (AdminAddTsigKeyResponse);
  rpc RemoveTsigKey(AdminRemoveTsigKeyRequest) returns (AdminRemoveTsigKeyResponse);
  rpc ListTsigKeys(google.protobuf.Empty) returns (AdminListTsigKeysResponse);

  // Real-time query stream
  rpc WatchQueryEvents(WatchQueryEventsRequest) returns (stream QueryEventMessage);
}

// Cache operations

message AdminFlushCacheRequest {
  enum FlushType {
    ALL = 0;          // Flush entire cache
    BY_NAME = 1;      // Flush specific name
    BY_DOMAIN = 2;    // Flush all under domain
    BY_TLD = 3;       // Flush entire TLD
    NEGATIVE_ONLY = 4; // Flush only negative cache entries
    EXPIRED_ONLY = 5;  // Flush expired entries
  }

  FlushType type = 1;
  string name = 2;     // For BY_NAME, BY_DOMAIN, BY_TLD
}

message AdminFlushCacheResponse {
  uint64 entries_flushed = 1;
  string message = 2;
}

message AdminCacheStatsResponse {
  uint64 hits = 1;
  uint64 misses = 2;
  uint64 evictions = 3;
  uint64 expirations = 4;
  int32 size = 5;
  double hit_rate = 6;
  int64 memory_bytes = 7;
  int64 max_memory = 8;
}

message AdminPurgeCacheRequest {
  string pattern = 1;  // Regex pattern or glob
  bool regex = 2;      // Use regex vs glob
}

message AdminPurgeCacheResponse {
  uint64 entries_purged = 1;
  repeated string samples = 2; // Sample of purged names
}

// Zone operations

message AdminRefreshZoneRequest {
  string zone_name = 1;
  bool force = 2; // Force refresh even if not changed
}

message AdminRefreshZoneResponse {
  bool refreshed = 1;
  string message = 2;
  int32 records_loaded = 3;
}

message AdminListZonesResponse {
  repeated AdminZoneInfo zones = 1;
}

message AdminZoneInfo {
  string name = 1;
  int32 record_count = 2;
  google.protobuf.Timestamp last_loaded = 3;
  string source_file = 4;
  bool compiled = 5;
  uint32 serial = 6;
}

message AdminReloadZonesResponse {
  int32 zones_reloaded = 1;
  repeated string failed_zones = 2;
  string message = 3;
}

// Query logging

message AdminSetQueryLoggingRequest {
  bool enabled = 1;
  string log_path = 2;     // Optional: change log path
  string format = 3;       // "json" or "text"
}

message AdminSetQueryLoggingResponse {
  bool success = 1;
  string message = 2;
}

message AdminQueryLoggingStatusResponse {
  bool enabled = 1;
  string log_path = 2;
  string format = 3;
  int64 queries_logged = 4;
  int64 log_size_bytes = 5;
}

// Rate limiting

message AdminSetRateLimitRequest {
  bool enabled = 1;
  int32 responses_per_second = 2;
  int32 errors_per_second = 3;
  int32 nxdomains_per_second = 4;
  repeated string exempt_clients = 5;
}

message AdminSetRateLimitResponse {
  bool success = 1;
  string message = 2;
}

message AdminRateLimitStatusResponse {
  bool enabled = 1;
  int32 responses_per_second = 2;
  int32 errors_per_second = 3;
  int32 nxdomains_per_second = 4;
  uint64 total_dropped = 5;
  uint64 total_slipped = 6;
}

// Server status

message AdminServerStatusResponse {
  string version = 1;
  google.protobuf.Timestamp start_time = 2;
  int64 uptime_seconds = 3;
  int32 goroutines = 4;
  int64 memory_bytes = 5;
  int32 zones_loaded = 6;
  bool healthy = 7;
  repeated AdminComponentStatus components = 8;
}

message AdminComponentStatus {
  string name = 1;
  bool healthy = 2;
  string message = 3;
}

message AdminMetricsResponse {
  uint64 queries_total = 1;
  uint64 queries_udp = 2;
  uint64 queries_tcp = 3;
  uint64 cache_hits = 4;
  uint64 cache_misses = 5;
  uint64 upstream_failures = 6;
  double avg_latency_ms = 7;
  double p99_latency_ms = 8;
}

message AdminShutdownRequest {
  int32 grace_period_seconds = 1; // Graceful shutdown period
}

message AdminShutdownResponse {
  bool success = 1;
  string message = 2;
}

// Connection management

message AdminListConnectionsRequest {
  string protocol = 1; // "tcp", "udp", or "" for all
  int32 limit = 2;     // Max connections to return
}

message AdminListConnectionsResponse {
  repeated AdminConnectionInfo connections = 1;
  int32 total_count = 2;
}

message AdminConnectionInfo {
  string id = 1;
  string protocol = 2;
  string client_ip = 3;
  int32 client_port = 4;
  google.protobuf.Timestamp connected_at = 5;
  int64 queries_served = 6;
}

message AdminKillConnectionRequest {
  string connection_id = 1;
}

message AdminKillConnectionResponse {
  bool success = 1;
  string message = 2;
}

// Zone management messages

message AdminCreateZoneRequest {
  string zone_name = 1;
  string zone_content = 2;  // YAML zone file content
  bool compile = 3;          // Compile to .dzc (default: true)
}

message AdminCreateZoneResponse {
  bool success = 1;
  string message = 2;
  int32 record_count = 3;
  string zone_file_path = 4;
}

message AdminUpdateZoneRequest {
  string zone_name = 1;
  string zone_content = 2;  // Updated YAML zone file content
  bool compile = 3;          // Recompile to .dzc (default: true)
  bool reload = 4;           // Reload zone after update (default: true)
}

message AdminUpdateZoneResponse {
  bool success = 1;
  string message = 2;
  int32 record_count = 3;
}

message AdminDeleteZoneRequest {
  string zone_name = 1;
  bool delete_files = 2;  // Also delete zone files from disk (default: true)
}

message AdminDeleteZoneResponse {
  bool success = 1;
  string message = 2;
}

message AdminGetZoneRequest {
  string zone_name = 1;
}

message AdminGetZoneResponse {
  AdminZoneInfo zone = 1;
  string zone_content = 2;  // YAML zone file content
}

// Record management messages

message AdminCreateRecordRequest {
  string zone_name = 1;
  string owner = 2;          // Record owner (e.g., "www", "@")
  string record_type = 3;    // A, AAAA, CNAME, MX, TXT, etc.
  string content = 4;        // Record data
  int32 ttl = 5;            // TTL in seconds (0 = use zone default)
  int32 priority = 6;        // For MX, SRV (optional)
}

message AdminCreateRecordResponse {
  bool success = 1;
  string message = 2;
  string record_id = 3;
}

message AdminUpdateRecordRequest {
  string zone_name = 1;
  string record_id = 2;      // Record identifier (owner:type:content)
  string owner = 3;          // New owner (optional)
  string record_type = 4;    // New type (optional)
  string content = 5;        // New content
  int32 ttl = 6;            // New TTL
  int32 priority = 7;        // New priority (for MX, SRV)
}

message AdminUpdateRecordResponse {
  bool success = 1;
  string message = 2;
}

message AdminDeleteRecordRequest {
  string zone_name = 1;
  string record_id = 2;      // Record identifier (owner:type:content)
}

message AdminDeleteRecordResponse {
  bool success = 1;
  string message = 2;
}

message AdminListRecordsRequest {
  string zone_name = 1;
  string record_type = 2;    // Filter by type (optional)
  string owner = 3;          // Filter by owner (optional)
}

message AdminListRecordsResponse {
  repeated AdminRecordInfo records = 1;
  int32 total_count = 2;
}

message AdminRecordInfo {
  string record_id = 1;
  string owner = 2;
  string record_type = 3;
  string content = 4;
  int32 ttl = 5;
  int32 priority = 6;
}

// TSIG Key Management Messages

message AdminAddTsigKeyRequest {
  string name = 1;      // Key name (FQDN, e.g., "xfer-key.example.com.")
  string algorithm = 2; // "hmac-sha256", "hmac-sha384", or "hmac-sha512"
  string secret = 3;    // Base64-encoded shared secret
}

message AdminAddTsigKeyResponse {
  bool success = 1;
  string message = 2;
}

message AdminRemoveTsigKeyRequest {
  string name = 1; // Key name to remove
}

message AdminRemoveTsigKeyResponse {
  bool success = 1;
  string message = 2;
}

message AdminListTsigKeysResponse {
  repeated TsigKeyInfo keys = 1;
}

message TsigKeyInfo {
  string name = 1;      // Key name (FQDN)
  string algorithm = 2; // Algorithm in use
  // NOTE: secret is intentionally NOT returned for security
}

// Real-time query stream

message WatchQueryEventsRequest {
  string zone_filter = 1;  // optional: only stream events for this zone; empty = all zones
}

message QueryEventMessage {
  string domain        = 1;  // queried name (e.g. "example.com.")
  string qtype         = 2;  // query type string (e.g. "A", "AAAA", "MX")
  string verdict       = 3;  // "NOERROR", "NXDOMAIN", "SERVFAIL", "REFUSED", etc.
  string zone          = 4;  // matched zone name, empty if none
  string client_prefix = 5;  // first 3 octets of client IP (privacy-safe)
  string protocol      = 6;  // "udp" or "tcp"
  int64  latency_us    = 7;  // query processing latency in microseconds
  google.protobuf.Timestamp timestamp = 8;
}

// FirewallAdminService exposes firewall management operations over gRPC.
// Additive to AdminService — registered on the same admin gRPC server port.
service FirewallAdminService {
  rpc FirewallStats(FirewallStatsRequest)         returns (FirewallStatsResponse);
  rpc LoadScript(FirewallLoadScriptRequest)       returns (FirewallLoadScriptResponse);
  rpc RemoveScript(FirewallRemoveScriptRequest)   returns (FirewallRemoveScriptResponse);
  rpc InjectScore(FirewallInjectScoreRequest)     returns (FirewallInjectScoreResponse);
}

message FirewallStatsRequest {}

message FirewallStatsResponse {
  uint64 total_queries    = 1;
  uint64 total_blocked    = 2;
  uint64 total_nxdomain   = 3;
  uint64 total_dropped    = 4;
  uint64 total_redirected = 5;
}

message FirewallLoadScriptRequest {
  string script_id = 1;
  string body      = 2;
}

message FirewallLoadScriptResponse {
  string script_id = 1;
}

message FirewallRemoveScriptRequest {
  string script_id = 1;
}

message FirewallRemoveScriptResponse {}

message FirewallInjectScoreRequest {
  oneof target {
    string domain = 1;
    string ip     = 2;
  }
  int32 score = 3;
}

message FirewallInjectScoreResponse {}

// DSYNCAdminService exposes RFC 9859 DSYNC operations over gRPC.
service DSYNCAdminService {
  // SendDSYNCNotify triggers outbound NOTIFY(CDS/CSYNC) to the parent zone.
  // Resolves _dsync.<parent> via live DNS lookup (per D-09). Fire-and-forget (per D-10).
  rpc SendDSYNCNotify(SendDSYNCNotifyRequest) returns (SendDSYNCNotifyResponse);
}

message SendDSYNCNotifyRequest {
  string zone_name = 1;
  string qtype = 2;
}

message SendDSYNCNotifyResponse {
  bool success = 1;
  string message = 2;
}
