# DNSScienced Production Configuration with ThreatScript
# This sample intentionally demonstrates a mixed deployment. Prefer one of the
# narrower validated roles documented in docs/ROLE_PROFILES.md.
role: custom

runtime:
  max_procs: 0          # Auto/container-aware; set only after measuring
  gc_percent: 100
  memory_limit_mb: 768  # Keep above cache.max_memory_mb plus process overhead

server:
  # Listen addresses
  udp_addr: "0.0.0.0:53"
  tcp_addr: "0.0.0.0:53"
  udp_listeners: 4

  # Encrypted DNS listeners are opt-in and require a certificate/key pair.
  doh:
    enabled: false
    address: "0.0.0.0:443"
    path: "/dns-query"
    cert_file: "/run/secrets/dns_tls_cert.pem"
    key_file: "/run/secrets/dns_tls_key.pem"
    timeout: 5s
  dot:
    enabled: false
    address: "0.0.0.0:853"
    cert_file: "/run/secrets/dns_tls_cert.pem"
    key_file: "/run/secrets/dns_tls_key.pem"
    timeout: 5s

  # Enable modes
  enable_authoritative: true
  enable_recursive: true
  # Never expose recursion publicly unless that is a deliberate service.
  recursion_allowed_cidrs:
    - "127.0.0.0/8"
    - "::1/128"

  # Recursive resolver configuration
  recursive:
    # Direct iterative resolution from root hints bypasses host/ISP resolvers.
    workers: 100
    worker_queue_size: 1000
    query_timeout: 2s
    max_iterations: 20
    nameserver_parallelism: 2
    nameserver_hedge_delay: 25ms
    enable_0x20: true
    enable_scrubbing: true
    qname_minimization: true     # QNAME minimization (RFC 7816 / RFC 9156)
    aggressive_nsec: true        # Aggressive NSEC caching (RFC 8198)
    serve_stale: true            # Serve stale on upstream failure (RFC 8767)
    stale_max_ttl: 24h           # Max stale record age

  # DNS Cookies
  enable_cookies: true

  # Rate Limiting
  enable_rrl: true
  rrl:
    enabled: true
    responses_per_second: 10
    exempt_cidrs:
      - "127.0.0.0/8"
      - "::1/128"

# Zone file directory
zones_dir: /opt/dnsscienced/zones

# Recursive cache limits and proactive refresh
cache:
  max_entries: 100000
  shard_count: 256
  max_memory_mb: 512
  prefetch: true
  prefetch_min_ttl_pct: 0.1

# Admin API
admin:
  # Fail closed until tls_cert_file, tls_key_file, tls_client_cas, and at
  # least one named api_key are provisioned by the deployment environment.
  enabled: false
  listen: "0.0.0.0:9091"

# Defensive DNS features
defensive:
  edns:
    enabled: true
    udp_size: 1232

  dnssec:
    validation: false  # Enable when trust anchors configured

  compression:
    enabled: true

# Experimental features (all disabled by default)
experimental:
  enabled: false

  # Protective DNS - malicious domain blocking
  protective_dns:
    enabled: false
    strategy: "nxdomain"
    enable_ede: true
